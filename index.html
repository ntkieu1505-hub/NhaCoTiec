      :root {
        --chat--color-primary: #881337;

    <script type="module">

      createChat({
        webhookUrl: 'https://nhacotiec.app.n8n.cloud/webhook/91dc254f-3743-4a2c-a884-d57a7fcddde4/chat',
        initialMessages: [
          'Xin chào anh/chị! Bên em là trợ lý của Nhà Có Tiệc.',

        i18n: {
          en: {
            title: 'Nhà Có Tiệc',
            subtitle: 'Tư vấn thiệp cưới điện tử',

            getStarted: 'Bắt đầu trò chuyện',
            inputPlaceholder: 'Nhập câu hỏi của anh/chị...'
          }
        }
      });
